version: "3.8"

services:
    # BACKEND - FASTAPI
    backend:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8000:8000"
        networks:
            - backend-network
        healthcheck:
            test: ["CMD", "curl", "--fail", "http://0.0.0.0:8000/health"]
            interval: 30s
            timeout: 10s
            retries: 3

    # WEB SERVER - NGINX
    nginx:
        image: nginx:1.25-alpine-slim
        ports:
            - "80:80"
        volumes:
            - ./docker/nginx.conf:/etc/nginx/nginx.conf
        depends_on:
            - backend
        networks:
            - backend-network

networks:
    backend-network:
        driver: bridge
